<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082536">
<meta name="description" content="Explore the fictional world of Gulf World: characters, clues, park map and story-inspired merchandise.">
<title>Gulf World</title>
<style>
:root{--navy:#071d2b;--deep:#04131e;--teal:#126277;--aqua:#82dce4;--cream:#f2ead8;--muted:#b9d3da}
*{box-sizing:border-box}body{margin:0;background:var(--deep);color:#edf8f8;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}.hero{padding:26px 20px 22px;background:linear-gradient(160deg,#176078,#071d2b 78%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#8ce6ed0c;right:-70px;top:-80px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--aqua)}h1{font:clamp(38px,10vw,58px) Georgia,serif;margin:8px 0}.tagline{font:italic 17px Georgia,serif;color:#d2eff0}.sub{font-size:13px;line-height:1.7;color:var(--muted);max-width:620px}.nav{position:sticky;top:0;z-index:10;display:flex;gap:5px;overflow:auto;padding:9px;background:#04131ef2;border-bottom:1px solid #245165}.nav button{border:1px solid #315a6a;color:#d7eff1;background:transparent;border-radius:9px;padding:10px 12px;white-space:nowrap;font-size:12px}.nav button.active{background:#176277;border-color:#64c4d0}.wrap{max-width:980px;margin:auto;padding:18px 14px 40px}.title{font:28px Georgia,serif;margin:4px 0 8px}.desc{font-size:13px;color:var(--muted);line-height:1.75;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#0a2737;border:1px solid #285466;border-radius:13px;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover;object-position:center 30%;display:block}.cardbody{padding:12px}.card h3{margin:0 0 5px;font:20px Georgia,serif}.role{font-size:11px;color:var(--aqua);margin-bottom:8px}.card p{font-size:12px;color:#c2d9de;line-height:1.65;margin:0 0 12px}.btn{border:1px solid #4e9eae;background:#155b70;color:white;padding:10px 13px;border-radius:9px;font-size:12px}.btn.secondary{background:transparent}.homebtn{display:inline-flex;align-items:center;gap:7px;margin-bottom:14px}.panel{background:linear-gradient(140deg,#10394b,#092333);border:1px solid #2a5a6d;border-radius:13px;padding:16px;margin:12px 0}.panel h3{font:22px Georgia,serif;margin:0 0 8px}.panel p{font-size:13px;line-height:1.8;color:#c5dce1}.quote{font:italic 19px Georgia,serif;color:var(--aqua);border-left:2px solid #58b5c2;padding:9px 12px;margin:14px 0}.map{width:100%;max-height:520px;background:#284f3f;border-radius:12px;border:1px solid #406d68;display:block}.mapbtn{fill:#082c3d;stroke:#a1e9ec;stroke-width:1.5;cursor:pointer}.maplabel{fill:#f0ffff;font:10px system-ui;text-anchor:middle;pointer-events:none}.productart{min-height:145px;display:flex;align-items:center;justify-content:center;background:#e5e4d8;color:#17334a;text-align:center;padding:14px}.productart svg{width:100%;max-width:220px;height:135px}.producttitle{font:19px Georgia,serif;margin:0 0 5px}.price{font-size:12px;color:var(--aqua);margin:10px 0}.mini{font-size:10px;line-height:1.6;color:#8eafb8;margin-top:18px}.clue{display:flex;gap:12px;align-items:flex-start}.clueicon{font-size:25px}.hidden{display:none!important}.footer{padding:22px;text-align:center;font-size:11px;color:#82a9b4;border-top:1px solid #204454}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card img{height:250px}.wrap{padding:24px}.hero{padding:34px max(24px,calc((100vw - 930px)/2))}}@media(max-width:370px){.grid{grid-template-columns:1fr}.card img{height:270px}}
</style>
</head>
<body>
<header class="hero"><div class="eyebrow">PANAMA CITY BEACH · FLORIDA</div><h1>Gulf World.</h1><div class="tagline">Some places leave a mark.</div><p class="sub">A story-world experience inspired by the park, the people, and the mystery beneath the surface.</p><button class="btn" onclick="showPage('home')">⌂ Back to Home</button></header>
<nav class="nav" aria-label="Main navigation">
<button data-page="home" class="active">⌂ Home</button><button data-page="map">⌖ Park Map</button><button data-page="characters">♙ Characters</button><button data-page="files">▤ Case Files</button><button data-page="shop">♧ Gift Shop</button><button data-page="tour">◉ Park Tour</button>
</nav>
<main class="wrap" id="app"></main>
<footer class="footer">GULF WORLD · PANAMA CITY BEACH, FL<br>Fan-made companion concept for the novel. Not affiliated with the real park.</footer>
<script>
const bios=[
{name:"Eloise",role:"Marine biology student",img:"assets/eloise.jpg",quote:"“There has to be an explanation.”",bio:"Curious, observant, and determined, Eloise is a college marine biology student whose questions pull her deeper into Gulf World's strange history. She wants evidence rather than easy answers, and she pays attention to details other people overlook. The mystery of the Silverfin dolphin challenges what she thinks she knows about the park—and about the people connected to it. As the investigation grows more complicated, Eloise must decide who deserves her trust and how far she is willing to go to uncover the truth.",facts:"Marine biology student · Curious · Determined · At the heart of the investigation"},
{name:"Charlie",role:"The unexpected partner",img:"assets/charlie.jpg",quote:"“It’s not just the bush.”",bio:"Charlie is genuine, playful, and quick with a joke when tension threatens to take over. His teasing gives Eloise a little breathing room, especially when their investigation starts to feel bigger than either of them expected. Beneath the humor, he can be perceptive and attentive to small details. His connection to Gulf World—and his running joke about the infamous bush—adds levity to a story full of unanswered questions.",facts:"Eloise’s partner · Good-humored · Observant · Loyal"},
{name:"Tessa",role:"The loyal friend",img:"assets/tessa.jpg",quote:"A little kindness can steady a storm.",bio:"Tessa is a thoughtful, comforting friend who helps Eloise keep her feet on the ground when the mystery threatens to take over. Baking is one of her ways of coping with stress, and cinnamon rolls are a signature comfort. She offers a different kind of strength: the willingness to listen, to show up, and to remind the people she loves that they do not have to solve everything alone.",facts:"Eloise’s friend · Caring · Bakes to cope · A steady source of support"},
{name:"Stella",role:"The guarded insider",img:"assets/stella.jpg",quote:"Not everyone wants the same secrets uncovered.",bio:"Confident and difficult to read, Stella knows about private tours and access to parts of Gulf World that ordinary visitors might never see. She does not always make people feel welcome, and Eloise cannot immediately tell whether she will be useful or obstructive. Her knowledge makes her an important presence in the investigation, but the reasons behind what she shares—and what she withholds—remain questions of their own.",facts:"Knows about private tours · Confident · Polished · Difficult to read"},
{name:"Owen",role:"A friend far away",img:"assets/owen.jpg",quote:"Distance doesn’t mean you’re out of the picture.",bio:"Owen is studying abroad in Hawaii, putting some distance between himself and the events unfolding around Gulf World. But being far away does not erase his connections to the group. Conversations and suggestions can help open a new avenue of thought, and his perspective adds another angle to the questions surrounding the park.",facts:"Studying in Hawaii · Connected to the group · Offers a different perspective"}
];
const goods=[
{name:"Gulf World Novel",sub:"The story behind the mystery",art:"book",desc:"The centerpiece of the collection: your Gulf World novel. Add the final cover image here when ready."},
{name:"Silverfin Dolphin Plush",sub:"A soft little mystery",art:"plush",desc:"A soft grey-blue dolphin plush inspired by your merchandise concept."},
{name:"Argentocetus Gulfensis Keychain",sub:"A scientific keepsake",art:"key",desc:"A miniature dolphin charm with a tag bearing the species name."},
{name:"Navy Gulf World Hoodie",sub:"Ocean-blue comfort",art:"hoodie",desc:"Navy hoodie with a small Gulf World logo on the front and a larger dolphin design on the back."},
{name:"The Infamous Bush Sticker",sub:"A very important bush",art:"bush",desc:"A leafy sticker with the famous title, inspired by Eloise and Charlie’s running joke."},
{name:"Vintage Gulf World T-shirt",sub:"A classic park design",art:"shirt",desc:"A vintage-style navy shirt featuring a leaping dolphin, waves, and the park building."},
{name:"Gulf World Tote",sub:"Books, beach days, and secrets",art:"tote",desc:"A cream tote with coastal-blue Gulf World artwork."},
{name:"Dolphin Sticker Set",sub:"Little pieces of the ocean",art:"stickers",desc:"A small collection of dolphin, wave, building, and logo stickers."}
];
let page="home",detail=null,wishlist=[];
function showPage(p){page=p;detail=null;render();window.scrollTo({top:0,behavior:"smooth"})}
function goBack(){if(detail){detail=null;render()}else showPage("home")}
function art(type){if(type==="book")return '<div style="font:22px Georgia,serif;color:#e7e5d7;background:linear-gradient(145deg,#194d69,#071c2b);width:100%;height:145px;display:grid;place-items:center">🐬<br>GULF WORLD</div>';if(type==="bush")return '<svg viewBox="0 0 180 140"><text x="90" y="20" font-size="12" font-family="Georgia" font-style="italic" font-weight="bold" text-anchor="middle" fill="#17334a">The Infamous Bush</text><g fill="#477b49"><circle cx="66" cy="70" r="28"/><circle cx="92" cy="54" r="28"/><circle cx="115" cy="75" r="27"/><circle cx="82" cy="86" r="30"/></g><path d="M90 100V119" stroke="#71503a" stroke-width="8"/></svg>';if(type==="plush")return '<svg viewBox="0 0 180 140"><ellipse cx="90" cy="82" rx="52" ry="28" fill="#7798a7"/><ellipse cx="90" cy="75" rx="45" ry="27" fill="#9bb8c0"/><path d="M45 78Q18 60 27 46L58 72M130 82L155 64L145 92M78 103Q58 123 45 111L74 95" fill="#7798a7"/><circle cx="126" cy="77" r="3" fill="#17334a"/></svg>';if(type==="key")return '<svg viewBox="0 0 180 140"><circle cx="70" cy="28" r="14" fill="none" stroke="#ac9d7e" stroke-width="5"/><path d="M70 42L95 74" stroke="#ac9d7e" stroke-width="5"/><ellipse cx="105" cy="84" rx="33" ry="15" fill="#7196a6"/><path d="M75 83L57 66L60 91M126 84L146 67L140 91" fill="#7196a6"/><text x="100" y="119" font-size="9" fill="#17334a" text-anchor="middle">ARGENTOCETUS</text></svg>';if(type==="hoodie")return '<svg viewBox="0 0 180 140"><path d="M66 34Q90 9 114 34L143 53L130 78L119 70L124 126H56L61 70L50 78L37 53Z" fill="#1b344e"/><path d="M70 37Q90 58 110 37L103 22H77Z" fill="#263f59"/><text x="90" y="73" fill="#e2e8e5" font-size="8" text-anchor="middle">GULF WORLD</text><path d="M80 80L100 80" stroke="#9bbbc8"/></svg>';if(type==="shirt")return '<svg viewBox="0 0 180 140"><path d="M65 28L83 21Q90 34 97 21L115 28L143 47L130 68L116 60L120 124H60L64 60L50 68L37 47Z" fill="#17324e"/><path d="M69 72Q89 57 111 72" fill="none" stroke="#8dbbc9" stroke-width="2"/><text x="90" y="90" fill="#e6edf0" font-size="10" font-family="Georgia" text-anchor="middle">Gulf World</text></svg>';if(type==="tote")return '<svg viewBox="0 0 180 140"><path d="M49 48H131L138 126H42Z" fill="#eee4cf" stroke="#c4b89e" stroke-width="2"/><path d="M65 50V34Q90 3 115 34V50" fill="none" stroke="#c4b89e" stroke-width="6"/><path d="M70 78Q88 61 104 78L118 72L111 89L98 91L90 101L82 91L69 89Z" fill="#2c6984"/><text x="90" y="112" font-size="10" font-family="Georgia" fill="#244a68" text-anchor="middle">Gulf World</text></svg>';return '<svg viewBox="0 0 180 140"><circle cx="56" cy="50" r="27" fill="#d4e8e6"/><circle cx="120" cy="53" r="25" fill="#c9e2e9"/><g fill="#367a96"><path d="M39 51Q51 35 68 51L80 45L74 59L62 61L55 69L48 61L38 59Z"/><path d="M103 53Q118 36 133 53L144 47L138 61L126 63L120 70L113 63L103 61Z"/></g><circle cx="87" cy="99" r="28" fill="#1d4964"/><text x="87" y="96" fill="#f1e8d8" font-size="10" text-anchor="middle">Gulf</text><text x="87" y="107" fill="#f1e8d8" font-size="10" text-anchor="middle">World</text></svg>'}
function home(){return `<div class="title">Welcome to Gulf World</div><p class="desc">Explore the park, meet the characters, inspect the case files, and visit the story-inspired gift shop.</p><div class="grid"><article class="card"><div class="productart" style="font-size:42px">🗺️</div><div class="cardbody"><h3>Explore the Park</h3><p>Tap locations on a schematic overhead map.</p><button class="btn" onclick="showPage('map')">Open map →</button></div></article><article class="card"><div class="productart" style="font-size:42px">🐬</div><div class="cardbody"><h3>Meet the Characters</h3><p>Portraits, longer biographies, and key details.</p><button class="btn" onclick="showPage('characters')">Meet them →</button></div></article><article class="card"><div class="productart" style="font-size:42px">📁</div><div class="cardbody"><h3>The Case Files</h3><p>Open the Silverfin mystery and explore story clues.</p><button class="btn" onclick="showPage('files')">Investigate →</button></div></article><article class="card"><div class="productart" style="font-size:42px">🛍️</div><div class="cardbody"><h3>Gift Shop</h3><p>Browse the novel, hoodies, plushies, and stickers.</p><button class="btn" onclick="showPage('shop')">Shop the story →</button></div></article></div><div class="panel"><h3>Something is waiting beneath the surface.</h3><p>The Silverfin mystery is only the beginning. Look closely, follow the clues, and decide what you believe.</p><button class="btn secondary" onclick="showPage('files')">Open first case file →</button></div>`}
function characters(){return `<div class="title">Meet the Characters</div><p class="desc">Tap a portrait to open a full character dossier. These are photorealistic concept portraits of fictional characters, not real people.</p><div class="grid">${bios.map((b,i)=>`<article class="card"><img src="${b.img}" alt="Concept portrait of ${b.name}"><div class="cardbody"><h3>${b.name}</h3><div class="role">${b.role}</div><p>${b.facts}</p><button class="btn" onclick="detail='person${i}';render()">Read full bio →</button></div></article>`).join("")}</div>`}
function person(i){let b=bios[i];return `<button class="btn secondary homebtn" onclick="goBack()">← Back to Characters</button><button class="btn secondary homebtn" onclick="showPage('home')">⌂ Home</button><div class="panel"><img src="${b.img}" alt="Concept portrait of ${b.name}" style="width:100%;max-height:430px;object-fit:cover;object-position:center 30%;border-radius:10px"><div class="eyebrow" style="margin-top:15px">CHARACTER DOSSIER · 00${i+1}</div><h2 class="title">${b.name}</h2><div class="role">${b.role}</div><div class="quote">${b.quote}</div><p>${b.bio}</p><h3>Key details</h3><p>${b.facts}</p></div>`}
function shop(){return `<div class="title">The Gift Shop</div><p class="desc">Merchandise concepts inspired by the designs you shared. Tap an item for its details. These are illustrated mockups, not live listings.</p><div class="grid">${goods.map((g,i)=>`<article class="card"><div class="productart">${art(g.art)}</div><div class="cardbody"><h3 style="font-size:17px">${g.name}</h3><div class="role">${g.sub}</div><button class="btn" onclick="detail='item${i}';render()">View item →</button></div></article>`).join("")}</div>`}
function item(i){let g=goods[i];return `<button class="btn secondary homebtn" onclick="goBack()">← Back to Gift Shop</button><button class="btn secondary homebtn" onclick="showPage('home')">⌂ Home</button><div class="panel"><div class="productart" style="border-radius:10px">${art(g.art)}</div><h2 class="title" style="margin-top:14px">${g.name}</h2><p>${g.desc}</p><div class="price">Price to be decided</div><button class="btn" onclick="wishlist.includes(${i})?wishlist=wishlist.filter(x=>x!==${i}):wishlist.push(${i});render()">${wishlist.includes(i)?"✓ Saved to wishlist":"♡ Add to wishlist"}</button><p class="mini">No payments or checkout are enabled in this prototype.</p></div>`}
function mapPage(){let places=[["Rear Pools","Large pools at the back of the property",160,49,"🌊"],["Central Building","Turquoise-roofed central building",160,143,"🏛️"],["Tropical Garden","Creative interior garden interpretation",111,186,"🌿"],["Courtyard","Open central area and paths",169,228,"🌴"],["Gift Shop","Story-inspired merchandise stop",220,267,"🛍️"],["Front Entrance","Front approach and parking area",160,310,"🐬"]];return `<div class="title">Overhead Park Map</div><p class="desc">A stylized schematic based on your overhead reference photo. Tap any glowing marker to learn about that location. This is not a survey-accurate architectural plan.</p><svg class="map" viewBox="0 0 320 350" role="img" aria-label="Interactive schematic map of Gulf World"><rect width="320" height="350" fill="#244d3d"/><path d="M0 20L320 0V350H0Z" fill="#315c42"/><rect x="25" y="18" width="270" height="315" rx="5" fill="#c3b79c"/><rect x="42" y="30" width="236" height="288" fill="#dfd4b7"/><rect x="70" y="34" width="180" height="54" fill="#167b8d" stroke="#f2e8d1" stroke-width="4"/><rect x="82" y="43" width="48" height="30" fill="#50b0b5"/><rect x="190" y="43" width="48" height="30" fill="#50b0b5"/><rect x="135" y="43" width="50" height="30" fill="#075268"/><rect x="66" y="101" width="188" height="192" fill="#157b7c" stroke="#f4ead4" stroke-width="6"/><rect x="83" y="117" width="154" height="159" fill="#d9cdb0" stroke="#f7edd9" stroke-width="5"/><rect x="99" y="133" width="122" height="127" fill="#387655"/><g fill="#91ad6c"><circle cx="119" cy="151" r="13"/><circle cx="199" cy="159" r="13"/><circle cx="119" cy="240" r="13"/><circle cx="198" cy="235" r="13"/><circle cx="160" cy="187" r="11"/></g><rect x="146" y="157" width="28" height="37" fill="#e7ddc2"/><rect x="146" y="204" width="28" height="37" fill="#e7ddc2"/><path d="M18 105V280M302 105V280" stroke="#a99b7e" stroke-width="7"/><text x="160" y="14" class="maplabel">REAR POOLS</text><text x="160" y="344" class="maplabel">FRONT APPROACH</text>${places.map((p,i)=>`<g onclick="detail='place${i}';render()" role="button" tabindex="0" aria-label="${p[0]}"><circle class="mapbtn" cx="${p[2]}" cy="${p[3]}" r="13"/><text x="${p[2]}" y="${p[3]+4}" class="maplabel">${i+1}</text></g>`).join("")}</svg><div class="panel"><h3>Choose a location</h3><div class="grid">${places.map((p,i)=>`<article class="card"><div class="cardbody"><h3>${p[0]}</h3><p>${p[1]}</p><button class="btn" onclick="detail='place${i}';render()">Explore →</button></div></article>`).join("")}</div></div>`}
function place(i){let a=[["Rear Pools","The rear pool area is one of the most recognizable features in the overhead reference. In the story experience, this is where the Silverfin mystery begins to take shape."],["Central Building","A turquoise-roofed central building forms the heart of the schematic, surrounded by walkways and courtyard space."],["Tropical Garden","This creative interior interpretation draws on your reference photos of lush plants, wooden structures, and a warm indoor garden."],["Courtyard","An open central area connects the imagined visitor route through the building."],["Gift Shop","Browse the Gulf World novel, dolphin plush, hoodie, keychains, stickers, and other merchandise concepts."],["Front Entrance","The exterior approach is inspired by your nighttime photo of the Gulf World sign and the overhead view of the front parking area."]][i];return `<button class="btn secondary homebtn" onclick="goBack()">← Back to Map</button><button class="btn secondary homebtn" onclick="showPage('home')">⌂ Home</button><div class="panel"><div class="eyebrow">PARK LOCATION</div><h2 class="title">${a[0]}</h2><p>${a[1]}</p><button class="btn" onclick="showPage('${i===4?'shop':i===0?'files':'tour'}')">${i===4?'Visit Gift Shop':i===0?'Open Silverfin Case':'Explore Tour'} →</button></div>`}
function files(){return `<div class="title">The Case Files</div><p class="desc">Story-inspired records, clues, and unanswered questions. This section can grow as you decide which details from the manuscript belong in the app.</p><div class="panel clue"><div class="clueicon">🐬</div><div><h3>File 001 · The Silverfin</h3><p>A rare dolphin, a troubling history, and questions that remain unanswered. Could the animal’s unusual traits point to a new discovery—or something else entirely?</p><button class="btn" onclick="detail='clue0';render()">Open file →</button></div></div><div class="panel clue"><div class="clueicon">🏚️</div><div><h3>File 002 · The Closed Case</h3><p>Why was the case never truly closed? Collect the facts, compare accounts, and keep track of the details that do not fit.</p><button class="btn" onclick="detail='clue1';render()">Open file →</button></div></div><div class="panel clue"><div class="clueicon">🔑</div><div><h3>File 003 · Private Access</h3><p>Private tours and restricted spaces raise questions about who has access—and why.</p><button class="btn" onclick="detail='clue2';render()">Open file →</button></div></div>`}
function clue(i){let c=[["The Silverfin","A rare dolphin, a troubling history, and questions that remain unanswered.","Evidence to collect: observations, archived reports, witness accounts, and details about unusual behavior."],["The Closed Case","The phrase “case never closed” sits at the center of the park’s mystery.","Questions to track: who made the original decision, what information was available, and what remains missing."],["Private Access","Tours and restricted spaces suggest not everyone sees the same version of Gulf World.","Questions to track: who can enter, who arranged the access, and what the visitors are allowed to see."]][i];return `<button class="btn secondary homebtn" onclick="goBack()">← Back to Case Files</button><button class="btn secondary homebtn" onclick="showPage('home')">⌂ Home</button><div class="panel"><div class="eyebrow">CASE FILE · 00${i+1}</div><h2 class="title">${c[0]}</h2><p>${c[1]}</p><h3>Investigation notes</h3><p>${c[2]}</p><button class="btn" onclick="this.textContent=this.textContent.startsWith('✓')?'Mark as Investigated':'✓ Mark as Investigated'">Mark as Investigated</button></div>`}
function tour(){return `<div class="title">Park Tour</div><p class="desc">A concept tour inspired by your interior photos. A true 3D walk-around with moving objects would need a separate 3D model; this version gives you clickable tour stops and room descriptions.</p><div class="grid"><article class="card"><div class="productart" style="font-size:45px">🌿</div><div class="cardbody"><h3>Tropical Interior</h3><p>Warm wooden beams, abundant greenery, and winding walkways.</p><button class="btn" onclick="detail='tour0';render()">Enter stop →</button></div></article><article class="card"><div class="productart" style="font-size:45px">🌊</div><div class="cardbody"><h3>Pool Deck</h3><p>Look out over the pools and the blue-green water.</p><button class="btn" onclick="detail='tour1';render()">Enter stop →</button></div></article><article class="card"><div class="productart" style="font-size:45px">🛍️</div><div class="cardbody"><h3>Gift Shop</h3><p>Find a souvenir from the world of Gulf World.</p><button class="btn" onclick="showPage('shop')">Enter shop →</button></div></article></div>`}
function tourDetail(i){let a=[["Tropical Interior","The indoor garden takes inspiration from your photos: tall wooden rafters, plants, rocks, shaded corners, and winding paths. The layout is creative rather than a verified floor plan."],["Pool Deck","The rear pools are modeled as the main landmark of the park. This is a fictionalized story-tour description based on your overhead reference."]][i];return `<button class="btn secondary homebtn" onclick="goBack()">← Back to Park Tour</button><button class="btn secondary homebtn" onclick="showPage('home')">⌂ Home</button><div class="panel"><div style="font-size:50px">${i===0?'🌿':'🌊'}</div><h2 class="title">${a[0]}</h2><p>${a[1]}</p><button class="btn" onclick="showPage('map')">See on Park Map →</button></div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let app=document.getElementById('app');if(detail){if(detail.startsWith('person'))app.innerHTML=person(+detail.slice(6));else if(detail.startsWith('item'))app.innerHTML=item(+detail.slice(4));else if(detail.startsWith('place'))app.innerHTML=place(+detail.slice(5));else if(detail.startsWith('clue'))app.innerHTML=clue(+detail.slice(4));else if(detail.startsWith('tour'))app.innerHTML=tourDetail(+detail.slice(4));return}app.innerHTML=({home,characters,shop,map:mapPage,files,tour})[page]();}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));render();
</script>
</body></html>
